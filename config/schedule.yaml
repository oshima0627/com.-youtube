#    外部の催眠術師が画面の主役の回で、BRDOCK への依頼の射程外。公開1時間前に
#    気づき、publishAt を明示的に null にして外した（private のまま）。
#    **status に publishAt を入れずに update しても消えない。null を送る必要がある。**
