# gate の決定論的判定で使う除外条件。ここに該当したものは LLM 判定に進まない。

# 個別に対象外とする動画 ID。
# タイトルと概要欄では判定できず、映像を見て初めて分かったものをここに書く。
video_ids:
  # 【解放】3時間オフ。概要欄に手がかりが無く自動判定は通過したが、
  # 外部ゲストの登場と、体育館で大学のユニフォームを着た一般の方々の
  # 映り込みがあった。第三者が特定できる形で映っている回は使わない。
  - fbKne9hTmgA

  # 【魔神】催眠術。概要欄にコラボの印が無く自動判定は通過したが、映像を見ると
  # 外部の催眠術師が終始映っており、clip01/clip02 では画面の主役になっている。
  # 許諾を依頼したのは BRDOCK のみで、この方の肖像・実演は依頼の射程外。
  # fbKne9hTmgA と同じ「第三者が特定できる形で映っている」類型。
  - RGm5F2m12as

  # 【総勢40組】やまと貸し出しプロジェクト第2弾（2026-08-28）。
  # 自動判定は ok=True で通過した（実行して確認）。概要欄に
  # 「総勢40組のクリエイターに借りていただきました」「コラボ動画を撮影する」とあり、
  # 40組の外部クリエイターが関わる企画そのものを扱う回。
  # 既存の description_patterns はどれにも一致しなかった（下の「コラボ動画」を追加）。
  - ARuwTdvqJJA

  # 【長期密着】命の燃やし方50万部（2026-07-14、3時間47分）。
  # 自動判定は ok=True で通過した（2026-09-04 に実行して確認）。
  # 概要欄に外部の方「金吾」の Instagram が貼られており、書籍・イベントの
  # 関係者と会場が長時間映る密着もの。第三者の肖像が射程外という点で
  # fbKne9hTmgA と同じ類型。**キーワードでは落とせないのでここに書く。**
  - lCKD3eRA6nE

# タイトルにこれらを含む動画は対象外。イベント回・コラボ回を落とす。
title_patterns:
  - CDF
  - コラボ
  - 生配信
  - 切り抜き

# 概要欄にこれらを含む動画は対象外。
# 「出演してくれたクリエイター」はコラボ回の最も確実な印。実測で判明した。
# タイトルだけの判定ではコラボ回を素通りさせるため、概要欄まで必ず見る。
description_patterns:
  # 「出演してくれた」で足りる。2026-09-04、コトダマMV密着（zvM7bkbavDQ）が
  # 「出演してくれたファンのみんな」と書いてあるのに素通りした。
  # クリエイターに限定していたのが穴だった。**ファン参加回もここで落とす。**
  - 出演してくれた
  - シャッフルコラボ
  # ARuwTdvqJJA が既存パターンを全て素通りしたため追加（2026-09-02）。
  # 見逃しは権利の問題になるが、誤検知は1本見送るだけなので、広めに倒す
  - コラボ動画
  - ゲスト出演
  - 提供
  - タイアップ
  - "#PR"
  - 案件

# 発言内容にこれらを含む区間は保留にする。
blocked_terms:
  - 訴訟
  - 逮捕
  - 謝罪
  - 炎上
  - finalize_me   # TODO: 回答が来たら先方の指定に合わせて確定させる
