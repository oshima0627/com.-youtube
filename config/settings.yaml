source_channel: https://www.youtube.com/@comdot

channel:
  # 投稿先。同じアカウントに複数チャンネルがあると取り違えるため、
  # 一致しない限りアップロードしない。`python -m clipper auth` で確認して書く。
  handle: "@com.-meibamen"
  expected_channel_id: UCoT2TYsxzH4t42C2oF-KrAw

  # カスタムサムネイルはチャンネルの電話番号確認が前提。使える番号が別の
  # アカウントで既に使われており確認できないため false。
  # ショートはフィードで動画フレームが使われ、1フレーム目に見出しの
  # オーバーレイが乗っているので実害は小さい。
  # 確認できるようになったら true にすれば、生成済みの画像を設定できる。
  custom_thumbnails: false

formats:
  short:
    width: 1080
    height: 1920
    max_seconds: 58
  wide:
    width: 1920
    height: 1080
    min_seconds: 120
    max_seconds: 600

limits:
  max_publish_per_day: 2

extract:
  min_score: 70

paths:
  work: work
  out: out
