source_channel: https://www.youtube.com/@comdot

channel:
  # 投稿先。同じアカウントに複数チャンネルがあると取り違えるため、
  # 一致しない限りアップロードしない。`python -m clipper auth` で確認して書く。
  handle: "@com.-meibamen"
  expected_channel_id: UCoT2TYsxzH4t42C2oF-KrAw

  # カスタムサムネイルはチャンネルの電話番号確認が前提。使える番号が別の
  # アカウントで既に使われており確認できないため false。
  # ショートはフィードで動画フレームが使われ、1フレーム目に見出しの
  # オーバーレイが乗っているので実害は小さい。
  # 確認できるようになったら true にすれば、生成済みの画像を設定できる。
  custom_thumbnails: false

  # このチャンネルで YouTube パートナープログラム（収益化）が有効かどうか。
  # **API では取れないので、Studio で見て手で書く。**
  # true にすると gate が permission.yaml の conditions.monetization を見て、
  # allowed でない限り公開を全部止める。収益化の許諾が取れていないまま
  # 収益を得ることを機械的に防ぐための札で、投稿そのものを止める札ではない。
  monetization_enabled: false

formats:
  short:
    width: 1080
    height: 1920
    # **この68秒は tora-kirinuki（令和の虎）市場の実測で、コムドット市場では
    # 一度も測り直していない。** コムドット競合ショート72本の中央値は31秒で、
    # こちらは全13本が49〜68秒に固まっている（docs/analytics-2026-09-02.md 3-2）。
    # ただし同じ72本で尺と再生数は無相関（r=0.050）なので、
    # **「短くすれば伸びる」根拠は無い。** 変えるなら実験として変えること。
    max_seconds: 68

  # 尺の実験用プリセット。**在庫18本は全部55〜68秒なので在庫では実験できない**
  # （切り直す＝再アップロードで1,600ユニット／本かかる）。
  # まだ上げていない M7ZxIL_b39E を短尺で書き出すときに使う。
  # 狙いは再生数ではなく完走率。スワイプ離脱が37%あり、
  # 完走率だけは尺と機械的に結びつく（これも未検証の仮説）。
  short_experiment:
    width: 1080
    height: 1920
    max_seconds: 35
  wide:
    width: 1920
    height: 1080
    # 電話番号確認ができないため15分を超える動画は投稿できない。
    # 市場の主流は13〜20分（tora-kirinuki の実測）だが、その下限側に寄せる。
    # 900秒ちょうどだと変換誤差で超える恐れがあるので余裕を持たせる。
    min_seconds: 600
    target_seconds: 780       # 13分
    max_seconds: 870          # 14分30秒
    hard_limit_seconds: 900   # これを超えたら投稿しない（YouTube側の制限）

limits:
  max_publish_per_day: 2

extract:
  min_score: 70

paths:
  work: work
  out: out

# 配信（露出）が動いたかどうかの判定基準。
# **合格線は結果を見る前に決めてある。** あとから下げて「達成した」ことにしない。
# 判定は scripts/distribution_check.py（ロジックは clipper/distribution.py）。
distribution_target:
  # 2026-09-10 に実測した基準値。公開16本・28日（2026/08/12〜09/08）で
  # インプレッション467回、ショートフィード経由4.7%。docs/analytics-2026-09-10.md
  baseline_measured_at: 2026-09-10
  baseline_impressions_per_video_28d: 29
  baseline_shorts_feed_ratio: 0.047

  # 在庫18本を9日で出し切り（2026-09-11〜09-19）、そこから10日おいて判定する。
  # この日より前は verdict = early で判定しない。
  decide_after: 2026-09-29
  min_videos: 10

  # 合格線。どちらか一方でも達すれば「配信は動いた」とみなす。
  pass_impressions_per_video_28d: 100
  pass_shorts_feed_ratio: 0.20

  # 合格線には届かないが基準のこの倍数を超えたら unclear（観測を延ばす）。
  # 両方ともこれに届かなければ fail ＝ 投稿頻度が原因という仮説の否定。
  moved_multiple: 1.5
