# 切り抜きの許諾ステータス。
# publish ステージは status が granted 以外のとき一切動かない。
# 詳細と依頼文は docs/permission-request.md を参照。

# 2026-09-02、運営者から「BRDOCK の許諾の回答が来た」との申告を受けて granted にした。
# 2026-09-04、Gmail（oshima6.27@gmail.com）を in:anywhere で探したが**回答は0件**。
# 2026-09-10、運営者が改めて「確認できた」と回答し、この status を維持して投稿を再開した。
#
# **根拠はいまも運営者の申告だけで、回答文そのものはこのリポジトリに無い。**
# 出どころ（メール／電話／フォームの画面上／SNS）も記録できていない。
# 回答文が手元にあれば docs/permission-request.md に貼り、条件を下へ書き写すこと。
# **conditions を unknown のまま埋めない。** 分からないものを allowed と書くと、
# 機械が「確認済み」として扱ってしまう。
status: granted          # pending | granted | denied
requested_to: 株式会社BRDOCK
requested_at: 2026-08-14
responded_at: 2026-09-02

# 回答で条件が付いた場合、ここへ書き写す。
# gate が実際に見ているのは 2026-09-04 時点で monetization だけ。
# settings.yaml の channel.monetization_enabled が true のとき、
# ここが allowed でなければ公開を全部止める。
# credit_required / member_images_allowed / excluded_video_types は
# **まだ誰も読んでいない記録用の欄**。機械が守ってくれると思わないこと。
conditions:
  monetization: unknown        # allowed | not_allowed | unknown
  credit_required: unknown     # 概要欄への出典表記の要否
  member_images_allowed: unknown  # アイコン・サムネへの本人画像使用
  excluded_video_types: []     # 先方から指定された対象外の種別

# 2026-10-29 実験初日の公開情報調査（Web 検索。一次情報ではないものは「二次」と明記）
# - 公式の切り抜きガイドライン（BRDOCK サイト https://brdc.co.jp/ ・事業 /business ・ニュース /news）:
#   見つからなかった。条件は unknown のまま。
# - 二次: ファンサイト https://youtuber-site.com/com-youtuber-kirinuki/ によると、2022-05-17 の本編で
#   やまとが「切り抜きOK・収益は切り抜き側でよい」と発言したとされる。元動画は未確認なので条件には書き写さない。
# - 二次: モデルプレス https://mdpr.jp/news/detail/3726809 （2023-05-01）によると、メンバーシップ内の
#   有料コンテンツを SNS 等に上げた切り抜きには顧問弁護士を通して法的対処をしているとの表明。
#   → メンバーシップ限定素材・本編中のメンシプ導入部分は使わない（既存ルールと一致）。
# - 今の運用（本編の一般公開回から、メンバー3人のみ映る区間を文脈テロップ付きで切り抜き）を
#   明確に禁じる記述は見つからなかった。
public_findings_checked_at: 2026-10-29
